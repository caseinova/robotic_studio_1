  <rect fill="#fff" height="45" rx="8" ry="8" stroke="#dce4ee" stroke-width="1.4" width="440" x="1652.0" y="674.5" />
  <text fill="#a95d00" font-family="DejaVu Sans Mono, monospace" font-size="17" font-style="normal" font-weight="bold" text-anchor="middle" x="1872" y="705">camera_from_destination_marker</text>
  <path d="M 1372,843 V 987" fill="none" marker-end="url(#arrow)" stroke="#6b7a8d" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
  <path d="M 1872,843 V 987" fill="none" marker-end="url(#arrow)" stroke="#6b7a8d" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
  <rect fill="#fff" height="45" rx="8" ry="8" stroke="#dce4ee" stroke-width="1.4" width="410" x="1167.0" y="906.5" />
  <text fill="#8053bf" font-family="DejaVu Sans Mono, monospace" font-size="19" font-style="normal" font-weight="bold" text-anchor="middle" x="1372" y="937">inverse(cube_from_marker_i)</text>
  <rect fill="#fff" height="45" rx="8" ry="8" stroke="#dce4ee" stroke-width="1.4" width="312" x="1716.0" y="906.5" />
  <text fill="#8053bf" font-family="DejaVu Sans Mono, monospace" font-size="21" font-style="normal" font-weight="bold" text-anchor="middle" x="1872" y="937">marker_from_cube</text>
