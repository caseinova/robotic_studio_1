  <text fill="#e78c18" font-family="DejaVu Sans Mono, monospace" font-size="20" font-style="normal" font-weight="bold" text-anchor="middle" x="655" y="1195">camera_from_tool_marker  [measurement]</text>
  <rect fill="#fff9ee" height="325" rx="8" stroke="#eed4a5" stroke-width="2" width="2050" x="75" y="1250" ry="8" />
  <text fill="#955b05" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="start" x="105" y="1300">Frame and measurement conventions</text>
  <text fill="#172033" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="normal" text-anchor="start" x="105" y="1347">{MT} is one physical frame. Its camera observation is not a second TF parent.</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="normal" text-anchor="start" x="105" y="1392">Multiple cube-face observations are fused into one cube pose, not published as multiple parents.</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="normal" text-anchor="start" x="105" y="1490">Solid: kinematic, calibrated or configured relation. Dashed orange: RGB-D measurement.</text>
  <text x="105" y="1436" fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">Arrows: parent to child. Label parent_from_child maps child coordinates into the parent.</text>
  <text x="105" y="1538" fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="24">Tool T is distinct from grasp G. Hardware tool_from_grasp is rigid; simulation varies with opening.</text>
</svg>
