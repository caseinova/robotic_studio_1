<svg xmlns="http://www.w3.org/2000/svg" baseProfile="full" height="1630" version="1.1" width="2200" viewBox="0 0 2200 1630" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">UR3e fixed-camera transform and measurement graph</title>
  <desc id="diagram-description">World coincides with the robot base. Forward kinematics leads to the flange, then the tool, its marker and grasp point. Camera calibration connects world to the camera. Dashed camera observations locate the tool marker, cube-face marker and destination marker. Inverse cube mounting gives a per-face cube pose, and the destination offset gives the desired cube pose. Arrows show parent-to-child relationships; parent_from_child maps child coordinates into the parent.</desc>
  <defs>
    <marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="11" refY="5">
      <path d="M0,0 L11,5 L0,10 Z" fill="#5e6d80" />
    </marker>
    <marker id="arrowo" markerHeight="10" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="11" refY="5">
      <path d="M0,0 L11,5 L0,10 Z" fill="#e78c18" />
    </marker>
  </defs>
  <rect fill="#f7fafc" height="1630" width="2200" x="0" y="0" />
  <text fill="#172033" font-family="DejaVu Sans, Arial, sans-serif" font-size="50" font-style="normal" font-weight="bold" text-anchor="start" x="90" y="87">UR3e transform and measurement graph</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-style="normal" font-weight="normal" text-anchor="start" x="92" y="133">Fixed-camera eye-to-hand installation | frame relationships, not ROS TF publication</text>
  <rect fill="#ffffff" height="118" rx="8" ry="8" stroke="#172033" stroke-width="3" width="650" x="775.0" y="179.0" />
  <text fill="#172033" font-family="DejaVu Sans, Arial, sans-serif" font-size="37" font-style="normal" font-weight="bold" text-anchor="middle" x="1100" y="234">World {W} = robot base</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" text-anchor="middle" x="1100" y="270">world_from_base = identity</text>
  <rect fill="#eff6ff" fill-opacity="0.75" height="810" rx="8" stroke="#8bb6f1" stroke-dasharray="12,9" stroke-width="3" width="981" x="67" y="350" ry="8" />
  <rect fill="#effaf3" fill-opacity="0.7" height="810" rx="8" stroke="#85cfb1" stroke-dasharray="12,9" stroke-width="3" width="1045" x="1090" y="350" ry="8" />
  <text fill="#2563eb" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-style="normal" font-weight="bold" text-anchor="start" x="112" y="402">KINEMATIC PATH</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="normal" text-anchor="start" x="112" y="436">Robot model and fixed mounting transforms</text>
  <text fill="#188657" font-family="DejaVu Sans, Arial, sans-serif" font-size="29" font-style="normal" font-weight="bold" text-anchor="start" x="1135" y="402">VISUAL PATH</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="normal" text-anchor="start" x="1135" y="436">Fixed-camera calibration and RGB-D observations</text>
  <path d="M 950,297 V 334 H 490 V 510" fill="none" marker-end="url(#arrow)" stroke="#6b7a8d" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
  <path d="M 1250,297 V 334 H 1610 V 510" fill="none" marker-end="url(#arrow)" stroke="#6b7a8d" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
