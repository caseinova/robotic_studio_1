  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" text-anchor="middle" x="277" y="1075">ArUco on gripper</text>
  <rect fill="#ffffff" height="110" rx="8" ry="8" stroke="#2563eb" stroke-width="3" width="355" x="572.5" y="988.0" />
  <text fill="#172033" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="middle" x="750" y="1039">Grasp {G}</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" text-anchor="middle" x="750" y="1075">Grasp TCP between fingers</text>
  <rect fill="#ffffff" height="110" rx="8" ry="8" stroke="#188657" stroke-width="3" width="420" x="1400.0" y="510.0" />
  <text fill="#172033" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="middle" x="1610" y="561">Camera {C}</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" text-anchor="middle" x="1610" y="597">Fixed optical frame</text>
  <rect fill="#ffffff" height="110" rx="8" ry="8" stroke="#188657" stroke-width="3" width="430" x="1157.0" y="733.0" />
  <text fill="#172033" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="middle" x="1372" y="784">Cube-face marker {Mi}</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" text-anchor="middle" x="1372" y="820">One visible cube marker</text>
  <rect fill="#ffffff" height="110" rx="8" ry="8" stroke="#188657" stroke-width="3" width="405" x="1669.5" y="733.0" />
  <text fill="#172033" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="bold" text-anchor="middle" x="1872" y="784">Destination marker {D}</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" text-anchor="middle" x="1872" y="820">Placement reference</text>
  <rect fill="#ffffff" height="110" rx="8" ry="8" stroke="#8053bf" stroke-width="3" width="420" x="1162.0" y="988.0" />
  <text fill="#172033" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="bold" text-anchor="middle" x="1372" y="1039">Cube centre {B}</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" text-anchor="middle" x="1372" y="1075">Per-face pose before fusion</text>
  <rect fill="#ffffff" height="110" rx="8" ry="8" stroke="#8053bf" stroke-width="3" width="420" x="1662.0" y="988.0" />
  <text fill="#172033" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="bold" text-anchor="middle" x="1872" y="1039">Desired cube pose {B*}</text>
  <text fill="#58667c" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="normal" text-anchor="middle" x="1872" y="1075">Placement target</text>
  <path d="M 490,620 V 732" fill="none" marker-end="url(#arrow)" stroke="#6b7a8d" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" />
  <rect fill="#ffffff" height="45" rx="8" ry="8" stroke="#dce4ee" stroke-width="1.4" width="316" x="332.0" y="652.5" />
  <text fill="#2563eb" font-family="DejaVu Sans Mono, monospace" font-size="23" font-style="normal" font-weight="bold" text-anchor="middle" x="490" y="683">flange_from_tool</text>
